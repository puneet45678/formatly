name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Outer kill switch. A timeout inside a test can't interrupt synchronous
    # code, so a hung formatter is stopped here instead (the same reason
    # workerClient terminates its worker rather than waiting on it).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (includes the core/UI import rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and architecture tests
        run: npm test

      - name: Performance budgets
        run: npm run test:perf

      - name: Build static export
        run: npm run build

      - name: Build the MCP server and check it over stdio
        run: |
          npm run build:mcp
          npm run test:mcp
