<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout B mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --line:#232323; --line2:#1a1a1a;
    --text:#ededed; --muted:#8f8f8f; --dim:#5c5c5c;
    --k:#7dd3fc; --s:#a7f3d0; --n:#fcd34d; --p:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050505;color:var(--text);font-family:Inter,system-ui,sans-serif;padding:24px}
  .app{position:relative;max-width:1180px;margin:0 auto;height:560px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
       background-color:var(--bg);
       background-image:linear-gradient(to right,rgba(255,255,255,.055) 1px,transparent 1px),
                        linear-gradient(to bottom,rgba(255,255,255,.055) 1px,transparent 1px);
       background-size:44px 44px}
  .app::after{content:"";position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse at 50% 0%,transparent 30%,var(--bg) 85%)}
  .app>*{position:relative;z-index:1}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line2);background:rgba(10,10,10,.6);backdrop-filter:blur(6px)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#fff,#777);display:inline-block}
  .navlinks{color:var(--muted);font-size:12.5px;display:flex;gap:18px}
  .body{display:flex;height:calc(100% - 49px)}
  .rail{width:150px;border-right:1px solid var(--line2);padding:14px 10px;background:rgba(10,10,10,.6);display:flex;flex-direction:column;gap:2px}
  .rail .lbl{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;padding:4px 10px 8px}
  .ri{font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:7px;display:flex;gap:9px;align-items:center}
  .ri em{font-style:normal;font:10px 'JetBrains Mono',monospace;color:var(--dim);width:22px}
  .ri.on{background:#1c1c1c;color:var(--text)}
  .ri.on em{color:var(--k)}
  .main{flex:1;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pane{background:rgba(17,17,17,.85);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(4px)}
  .pane-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .pane-h b{color:var(--text);font-weight:500}
  .code{font:12px/1.65 'JetBrains Mono',monospace;padding:12px 14px;color:#cfcfcf;white-space:pre;overflow:hidden;flex:1}
  .ln{color:#3f3f3f;display:inline-block;width:22px}
  .k{color:var(--k)} .s{color:var(--s)} .n{color:var(--n)} .p{color:var(--p)}
  .chip{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
  .ok{color:#4ade80;font-size:11px;display:flex;align-items:center;gap:6px}
  .ok::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80}
</style>
</head>
<body>
<div class="app">
  <div class="nav"><div class="logo"><i></i>formatly</div><div class="navlinks"><span>Shortcuts</span><span>GitHub</span></div></div>
  <div class="body">
    <div class="rail">
      <div class="lbl">Formats</div>
      <div class="ri on"><em>{ }</em>JSON</div>
      <div class="ri"><em>---</em>YAML</div>
      <div class="ri"><em>-&gt;</em>Mermaid</div>
      <div class="ri"><em>&lt;/&gt;</em>XML</div>
      <div class="ri"><em>SQL</em>SQL</div>
      <div class="ri"><em>#</em>Markdown</div>
    </div>
    <div class="main">
      <div class="pane"><div class="pane-h"><b>Input · JSON</b><span class="chip">Clear</span></div>
<div class="code"><span class="ln">1</span><span class="p">{</span><span class="k">"user"</span>:<span class="p">{</span><span class="k">"id"</span>:<span class="n">42</span>,<span class="k">"name"</span>:<span class="s">"Asha"</span>,
<span class="ln">2</span><span class="k">"roles"</span>:<span class="p">[</span><span class="s">"admin"</span>,<span class="s">"dev"</span><span class="p">]</span>,<span class="k">"active"</span>:<span class="n">true</span><span class="p">}}</span></div></div>
      <div class="pane"><div class="pane-h"><b>Output</b><span style="display:flex;gap:8px;align-items:center"><span class="ok">Valid</span><span class="chip">Copy</span><span class="chip">Download</span></span></div>
<div class="code"><span class="ln">1</span><span class="p">{</span>
<span class="ln">2</span>  <span class="k">"user"</span>: <span class="p">{</span>
<span class="ln">3</span>    <span class="k">"id"</span>: <span class="n">42</span>,
<span class="ln">4</span>    <span class="k">"name"</span>: <span class="s">"Asha"</span>,
<span class="ln">5</span>    <span class="k">"roles"</span>: <span class="p">[</span><span class="s">"admin"</span>, <span class="s">"dev"</span><span class="p">]</span>,
<span class="ln">6</span>    <span class="k">"active"</span>: <span class="n">true</span>
<span class="ln">7</span>  <span class="p">}</span>
<span class="ln">8</span><span class="p">}</span></div></div>
    </div>
  </div>
</div>
</body>
</html>
